[pytest]
# Ohne diese Datei sammelt `pytest` aus der Projektwurzel Fremdmaterial mit ein
# und bricht schon beim Einsammeln ab:
#
# - export_clean_20261117/ und handoff_20261116/ enthalten eigene Kopien von
#   research_agent und scripts. Sie schieben ihr Paket vor das echte und der
#   Import scheitert mit "No module named 'research_agent.database'" bzw.
#   "'research_agent.tests'" (107 Sammelfehler am 18.11.2026).
# - .venv und .venv_finetune enthalten fremde Suiten (pandas, numpy, sympy).
# - public_benchmark/raw_data/evidence_inference/ ist mitgelieferter Fremdcode;
#   sein split_train_val_test.py wird als *_test.py eingesammelt und liest beim
#   Import einen absoluten Pfad (/home/ubuntu/...), der hier nicht existiert.
#
# Die eigenen Suiten bleiben eingesammelt: research_agent/tests und
# public_benchmark/tests. Muster gelten fuer Verzeichnisnamen, nicht fuer Pfade.
norecursedirs = export_clean_* handoff_* .venv* venv* raw_data build dist node_modules *.egg .git
